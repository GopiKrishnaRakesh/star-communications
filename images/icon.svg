<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#182326" />
      <stop offset="100%" stop-color="#0e1517" />
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#56cca0" />
      <stop offset="50%" stop-color="#34a87a" />
      <stop offset="100%" stop-color="#237452" />
    </linearGradient>
    <linearGradient id="orbitGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7be3ba" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#2a8c63" stop-opacity="0.3" />
    </linearGradient>
    <linearGradient id="orbitGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#56cca0" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#1b5a3e" stop-opacity="0.2" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#48bb88" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#48bb88" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background Container Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />

  <!-- Ambient Radiant Core Glow -->
  <circle cx="32" cy="32" r="20" fill="url(#glow)" />

  <!-- Telecom Orbital Wave Rings (Signal Waves) -->
  <ellipse cx="32" cy="32" rx="25" ry="9.5" transform="rotate(-30 32 32)" stroke="url(#orbitGrad1)" stroke-width="1.8" stroke-dasharray="90 25" stroke-linecap="round" />
  <ellipse cx="32" cy="32" rx="21" ry="8" transform="rotate(35 32 32)" stroke="url(#orbitGrad2)" stroke-width="1.5" stroke-dasharray="70 20" stroke-linecap="round" />

  <!-- The Nexus Star (Curved Aerodynamic Precision Star) -->
  <path d="M 32 11 Q 32 32 53 32 Q 32 32 32 53 Q 32 32 11 32 Q 32 32 32 11 Z" fill="url(#starGrad)" />

  <!-- Precision Star Facet Highlight (Adds 3D Tech Depth) -->
  <path d="M 32 11 Q 32 32 53 32 L 32 32 Z" fill="#6fe0b3" opacity="0.4" />
  <path d="M 32 53 Q 32 32 11 32 L 32 32 Z" fill="#1b5e40" opacity="0.4" />

  <!-- Central Nexus Core -->
  <polygon points="32,26 38,32 32,38 26,32" fill="#ffffff" opacity="0.95" />
  <circle cx="32" cy="32" r="2.2" fill="#1b4d3e" />

  <!-- Signal Pulse Nodes (Cardinal Telecommunication Points) -->
  <circle cx="32" cy="7" r="1.5" fill="#56cca0" />
  <circle cx="57" cy="32" r="1.5" fill="#56cca0" />
  <circle cx="32" cy="57" r="1.5" fill="#56cca0" />
  <circle cx="7" cy="32" r="1.5" fill="#56cca0" />
</svg>
